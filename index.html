<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Legal — BookNStyle</title>
<style>
  :root { --ink:#16182B; --gold:#C8956A; --soft:#666A78; --cream:#FAFAF7; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--cream); color:var(--ink);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  header { background:var(--ink); padding:28px 20px; text-align:center; }
  header .mark { font-family:Didot,Georgia,"Times New Roman",serif; font-size:34px; color:var(--gold); line-height:1; }
  header .name { margin-top:6px; font-size:11px; letter-spacing:2px; color:#E6C49B; text-transform:uppercase; }
  main { max-width:760px; margin:0 auto; padding:36px 20px 72px; }
  h1 { font-size:30px; line-height:1.25; margin:0 0 6px; }
  h2 { font-size:21px; margin:38px 0 10px; padding-top:18px; border-top:1px solid #E6E1D6; }
  h3 { font-size:17px; margin:26px 0 8px; color:#2A2E45; }
  p, li { margin:0 0 13px; }
  ul { padding-left:22px; margin:0 0 13px; }
  a { color:#8A5F38; }
  strong { color:var(--ink); }
  footer { max-width:760px; margin:0 auto; padding:0 20px 56px; color:var(--soft); font-size:13px; }
  @media (prefers-color-scheme: dark) {
    :root { --cream:#0E1018; --ink:#F5F4EE; --soft:#8E8F95; }
    body { background:var(--cream); color:var(--ink); }
    header { background:#181B26; }
    h2 { border-top-color:#262936; } h3 { color:#D8D6CE; } a { color:#D8AF87; }
  }
</style></head><body>

<main>

</main>
<footer>BookNStyle LLC · Great Neck, New York 11021 · <a href="mailto:support@booknstyle.com">support@booknstyle.com</a></footer>
</body></html>
